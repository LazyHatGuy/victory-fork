[alias]
xtask = "run --quiet --package xtask --"
# Windows binary from a Linux box (see docs/proton.md).
win = "build -p victory --target x86_64-pc-windows-gnu --release"
# Type-check the tree as the Windows CI builds it, without an MSVC linker.
win-check = "check --workspace --all-targets --target x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
